<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Food Analysis</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page-container">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue analyzing your food
            </p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="message">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}


            <!-- LOGIN FORM -->
            <form method="POST" action="{{ url_for('login') }}">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="signup-text">
                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Sign Up
                </a>
            </p>

        </div>

    </div>

</body>
</html>
